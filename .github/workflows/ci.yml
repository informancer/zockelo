name: CI

on:
  # Quality gate: runs on PRs targeting develop or main, and on pushes to
  # develop, release/*, and hotfix/* branches.
  pull_request:
    branches: [develop, main]
  push:
    branches:
      - develop
      - "release/**"
      - "hotfix/**"
    tags:
      - "v*"

env:
  ELIXIR_VERSION: "1.18.3"
  OTP_VERSION: "27.3"
  MIX_ENV: test

jobs:
  # ---------------------------------------------------------------------------
  # Quality gate — lint, format, security, tests
  # ---------------------------------------------------------------------------
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zockelo_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: "ecto://postgres:postgres@localhost:5432/zockelo_test"
      EVENT_STORE_URL: "ecto://postgres:postgres@localhost:5432/zockelo_eventstore_test"
      SECRET_KEY_BASE: "test_secret_key_base_at_least_64_chars_long_for_phoenix_framework_ok"
      CLOAK_KEY: "lnb5HXmDgUCIqrHMJjz3/1N8pOKWjq5BOLw5QBjCZGA="

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ env.MIX_ENV }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-build-${{ env.MIX_ENV }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run Credo
        run: mix credo --strict

      - name: Run Sobelow security scan
        run: mix sobelow --config

      - name: Run tests
        run: mix test --cover

  # ---------------------------------------------------------------------------
  # Build + publish Docker image
  # ---------------------------------------------------------------------------
  docker:
    name: Docker Build & Publish
    runs-on: ubuntu-latest
    needs: quality
    # Only publish from push events (not PRs), and only for relevant branches/tags
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/zockelo
          tags: |
            # Edge image on develop push
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/develop' }}
            # Latest image on main push
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # Versioned image on v* tag
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # Always include commit SHA
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
